<body>

        width="350"></a>
        <img id="menu-hamburguesa" src="https://cdn-icons-png.flaticon.com/512/2976/2976215.png" alt="Icono Menú">

        <div id="botones-menu">
            <a href="#">Inicio</a>
            <a href="#">Más Noticias</a>
        </div>  
    </nav>
    <body>
            <div class="contenedor">
                <main>
                    <h1 id="titulo-saludo">HOLA</h1>
                    <p id="subtitulo-formulario">Completá tus datos para suscribirte al diario</p>

                    <form id="form-suscripcion" action="#" novalidate>
                        
                        <div class="grupo-control">
                            <label for="nombre">Nombre completo:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Juan Perez">
                            <span class="error-msj" id="error-nombre"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                            <span class="error-msj" id="error-email"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
                            <span class="error-msj" id="error-password"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="repetir-password">Repetir contraseña:</label>
                            <input type="password" id="repetir-password" name="repetir-password" placeholder="Repetí tu contraseña">
                            <span class="error-msj" id="error-repetir-password"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="edad">Edad:</label>
                            <input type="number" id="edad" name="edad" placeholder="Mayor o igual a 18">
                            <span class="error-msj" id="error-edad"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="telefono">Teléfono:</label>
                            <input type="text" id="telefono" name="telefono" placeholder="Solo números">
                            <span class="error-msj" id="error-telefono"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="direccion">Dirección:</label>
                            <input type="text" id="direccion" name="direccion" placeholder="Calle y número">
                            <span class="error-msj" id="error-direccion"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="ciudad">Ciudad:</label>
                            <input type="text" id="ciudad" name="ciudad" placeholder="Rosario">
                            <span class="error-msj" id="error-ciudad"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="cp">Código Postal:</label>
                            <input type="text" id="cp" name="cp" placeholder="Mínimo 3 caracteres">
                            <span class="error-msj" id="error-cp"></span>
                        </div>

                        <div class="grupo-control">
                            <label for="dni">DNI:</label>
                            <input type="text" id="dni" name="dni" placeholder="Solo números">
                            <span class="error-msj" id="error-dni"></span>
                        </div>

                        <div class="contenedor-boton">
                            <button type="submit" id="btn-enviar">Enviar</button>
                        </div>

                    </form>
                </main>
            </div>
    <script src="script.js" defer></script>
    </body>
