<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick & Morty API - TP2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <h1>Rick & Morty API - TP2</h1>

    </header>

    <button id="btnFetch">Mostrar todos los personajes</button>

    <form id="formFiltros">

        <div>
            <label for="inputNombre">Nombre:</label>
            <input type="text" id="inputNombre" placeholder="Ingrese un nombre">
        </div>

        <div>
            <label for="selectEstado">Estado:</label>
            <select id="selectEstado">
                <option value="">Todos</option>
                <option value="Alive">Alive</option>
                <option value="Dead">Dead</option>
                <option value="unknown">Desconocido</option>
            </select>
        </div>

        <div>
            <label for="inputEspecie">Especie:</label>
            <input type="text" id="inputEspecie" placeholder="Ej: Human, Alien">
        </div>

        <div>
            <label for="inputTipo">Tipo:</label>
            <input type="text" id="inputTipo" placeholder="Ej: Super Mutant">
        </div>

        <div>
            <label for="selectGenero">Género:</label>
            <select id="selectGenero">
                <option value="">Todos</option>
                <option value="male">Hombre</option>
                <option value="female">Mujer</option>
                <option value="genderless">Sin Género</option>
                <option value="unknown">Desconocido</option>
            </select>
        </div>

        <button type="submit" id="btnFiltrar">Aplicar Filtros</button>

    </form>



    <p id = "estado"></p>
    <ul id = "personajes"></ul>

    <div class="paginacion">
        <button id="btnAnterior">Anterior</button>
        <button id="btnSiguiente">Siguiente</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
